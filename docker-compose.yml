# CPN installer via Docker (AlmaLinux + systemd).
# Usage:
#   ./scripts/docker-build-rpm.sh          # if you do not already have an RPM
#   ./scripts/docker-run.sh                # preferred helper
#   # or manually after placing cpn-installer.rpm in the repo root:
#   docker compose build
#   docker compose up -d
#
# Security: systemd as PID 1 needs host cgroup access (cgroupns + rw /sys/fs/cgroup).
# Prefer the reduced capability set below. Set privileged: true only if that fails and
# you accept the risk on a dedicated lab host (no automatic privileged fallback).
# Do not expose 2087 to the public internet.
#
# Persistence: bind mounts under CPN_DOCKER_DATA_ROOT (default /var/lib/cpn-docker-host)
# so pull and recreate keeps panel settings, websites, databases, and certificates.
# Host data dirs: chmod 0755 only (never 777). See docs/DOCKER-DATA-LAYOUT.md.
# Pre-built Hub image (including Ubuntu): docker-compose.hub.yml

services:
  cpn-installer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALMA_VERSION: "${CPN_ALMA_VERSION:-9}"
    image: "cpn-installer:el${CPN_ALMA_VERSION:-9}"
    container_name: cpn-installer
    hostname: cpn-installer
    # Reduced capabilities (not full --privileged). Override with privileged: true if needed.
    privileged: false
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_RESOURCE
      - SYS_NICE
      - SYS_PTRACE
      - AUDIT_WRITE
      - AUDIT_CONTROL
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cgroupns_mode: host
    environment:
      container: docker
    ports:
      - "${CPN_PORT:-2087}:2087"
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # :Z relabels for SELinux Enforcing (AlmaLinux/RHEL); ignored where SELinux is off.
      - ${CPN_DOCKER_DATA_ROOT:-/var/lib/cpn-docker-host}/cpn-data:/var/lib/cpn:Z
      - ${CPN_DOCKER_DATA_ROOT:-/var/lib/cpn-docker-host}/cpn-home:/home:Z
      - ${CPN_DOCKER_DATA_ROOT:-/var/lib/cpn-docker-host}/cpn-mysql:/var/lib/mysql:Z
      - ${CPN_DOCKER_DATA_ROOT:-/var/lib/cpn-docker-host}/cpn-letsencrypt:/etc/letsencrypt:Z
      - ${CPN_DOCKER_DATA_ROOT:-/var/lib/cpn-docker-host}/cpn-webmail:/var/lib/cpn-webmail:Z
    stop_signal: SIGRTMIN+3
    restart: unless-stopped
