<body class="h-full bg-canvas-white text-on-surface flex flex-col items-center justify-center font-body">
<div class="w-full max-w-sm px-lg flex flex-col items-center">
<!-- Logo Area -->
<div class="mb-xxl flex flex-col items-center">
<div class="w-16 h-16 bg-surface-container-low rounded-xl flex items-center justify-center mb-xl shadow-sm border border-hairline">
<span class="material-symbols-outlined text-primary text-3xl">dns</span>
</div>
<h1 class="font-display-md text-display-md text-on-surface text-center">Sign In</h1>
</div>
<!-- Login Form -->
<form class="w-full space-y-lg flex flex-col" onsubmit="event.preventDefault();">
<div class="space-y-sm w-full">
<label class="sr-only" for="email">Email Address</label>
<div class="relative w-full">
<span class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-muted-text">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="w-full h-[44px] pl-[48px] pr-md bg-surface-container-low border border-hairline rounded-full text-body font-body text-on-surface placeholder-muted-text focus:outline-none focus:ring-2 focus:ring-focus-ring focus:border-transparent transition-all" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
</div>
<div class="space-y-sm w-full">
<label class="sr-only" for="password">Password</label>
<div class="relative w-full">
<span class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-muted-text">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="w-full h-[44px] pl-[48px] pr-md bg-surface-container-low border border-hairline rounded-full text-body font-body text-on-surface placeholder-muted-text focus:outline-none focus:ring-2 focus:ring-focus-ring focus:border-transparent transition-all" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="flex justify-end w-full mt-xs">
<a class="font-caption text-caption text-focus-ring hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full h-[44px] bg-primary text-canvas-white rounded-full font-button-large text-button-large hover:bg-primary-container active:scale-95 transition-all duration-200 flex items-center justify-center mt-xl" type="submit">
                Sign In
            </button>
</form>
</div>
<!-- Minimal Footer -->
<footer class="absolute bottom-section w-full text-center">
<p class="font-fine-print text-fine-print text-muted-text">
            © 2024 NT&amp;DBN Panel. All rights reserved.
        </p>
</footer>
</body></html>
