name: Bug report
description: Report a defect in the CPN installer, panel, packaging, or docs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Control Panel Network (CPN).

        For security-sensitive findings, do **not** use this form. Prefer private vulnerability reporting or the channels in [SECURITY.md](https://github.com/Control-Panel-Network/CPN-Control-Panel-Network/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what went wrong.
      placeholder: Installer UI fails to load after choosing MariaDB on AlmaLinux 9.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps someone else can follow.
      placeholder: |
        1. Start the installer with ...
        2. Open the UI at ...
        3. Choose ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including error text if any.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Installer (CLI / binary)
        - Installer UI
        - Panel
        - Packaging (RPM / container)
        - Documentation
        - CI / GitHub Actions
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / environment
      description: Guest OS, install method (binary, RPM, container), and CPN version or commit if known.
      placeholder: AlmaLinux 9.6, RPM from release v0.x.y, commit abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant logs (redact tokens and secrets). Attach screenshots if useful.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I redacted installer tokens, passwords, and other secrets from this report.
          required: true
