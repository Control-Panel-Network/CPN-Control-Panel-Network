name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Preparar recursos para el análisis
        run: |
          mkdir -p installer-ui/dist
          cp installer-ui/index.html installer-ui/dist/index.html

      - name: Comprobar formato
        run: cargo fmt --check

      - name: Comprobar compilación
        run: cargo check

      - name: Ejecutar pruebas
        run: cargo test

      - name: Ejecutar Clippy
        run: cargo clippy -- -D warnings

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer-ui
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run lint

  panel:
    name: Panel Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Panel
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar ESLint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # RPM functional matrix stays AlmaLinux 9 by default (tests/docker-matrix.sh).
      # AlmaLinux 10: CPN_TEST_IMAGE=almalinux:10 ./tests/docker-matrix.sh
      # Docker install helpers: scripts/docker-run.sh, scripts/docker-build-rpm.sh
      - name: Comprobar sintaxis Bash
        run: >
          bash -n
          scripts/build-rpm.sh
          scripts/docker-build-rpm.sh
          scripts/docker-run.sh
          tests/docker-matrix.sh
