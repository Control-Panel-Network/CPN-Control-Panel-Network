name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Rust
        # Pin to commit SHA (actions/unpinned-tag). Tag: stable.
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Instalar Node.js (bundle real de Vite)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Construir installer-ui embebido
        working-directory: installer-ui
        run: |
          npm ci
          npm run build

      - name: Comprobar formato
        run: cargo fmt --check

      - name: Comprobar versión sincronizada
        run: |
          chmod +x scripts/check-version-sync.sh scripts/sync-version.sh
          ./scripts/check-version-sync.sh

      - name: Comprobar compilación (locked)
        run: cargo check --locked

      - name: Ejecutar pruebas
        run: cargo test --locked

      - name: Ejecutar Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Auditoría de dependencias Rust
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer-ui
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run lint

      - name: Auditoría npm (instalador UI)
        run: npm audit --audit-level=high

      - name: Build Vite de producción
        run: npm run build

  panel:
    name: Panel Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Panel
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar ESLint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Auditoría npm (Panel)
        run: npm audit --audit-level=high

      - name: Build de producción Next.js
        run: npm run build

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # Privileged docker-matrix stays in .github/workflows/os-matrix.yml (issue #7:
      # no --privileged on untrusted PRs). Operators can also run:
      #   CPN_TEST_IMAGES="rockylinux:9 almalinux:8" ./tests/docker-matrix.sh
      - name: Comprobar sintaxis Bash
        run: >
          bash -n
          scripts/build-rpm.sh
          scripts/build-deb.sh
          scripts/docker-build-rpm.sh
          scripts/docker-build-deb.sh
          scripts/docker-run.sh
          scripts/sync-version.sh
          scripts/check-version-sync.sh
          scripts/publish-checksums.sh
          scripts/sign-release.sh
          scripts/sign-cosign.sh
          tests/docker-matrix.sh
          tests/webmail-permissions.sh
