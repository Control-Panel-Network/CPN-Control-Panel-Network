name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Rust
        # Pin to commit SHA (actions/unpinned-tag). Tag: stable.
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Instalar Node.js (bundle real de Vite)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Construir installer-ui embebido
        working-directory: installer-ui
        run: |
          npm ci
          npm run build

      - name: Comprobar formato
        run: cargo fmt --check

      - name: Comprobar compilación
        run: cargo check

      - name: Ejecutar pruebas
        run: cargo test

      - name: Ejecutar Clippy
        run: cargo clippy -- -D warnings

      - name: Auditoría de dependencias Rust
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer-ui
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run lint

  panel:
    name: Panel Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Panel
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar ESLint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Build de producción Next.js
        run: npm run build

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # Privileged docker-matrix is manual only (issue #7).
      - name: Comprobar sintaxis Bash
        run: >
          bash -n
          scripts/build-rpm.sh
          scripts/docker-build-rpm.sh
          scripts/docker-run.sh
          scripts/sync-version.sh
          scripts/publish-checksums.sh
          tests/docker-matrix.sh
