name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Preparar recursos para el análisis
        run: |
          mkdir -p installer-ui/dist
          cp installer-ui/index.html installer-ui/dist/index.html

      - name: Comprobar formato
        run: cargo fmt --check

      - name: Comprobar compilación
        run: cargo check --locked

      - name: Ejecutar pruebas
        run: cargo test --locked

      - name: Ejecutar Clippy
        run: cargo clippy --locked -- -D warnings

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer-ui
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run lint

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Comprobar sintaxis Bash
        run: bash -n scripts/build-rpm.sh tests/docker-matrix.sh
