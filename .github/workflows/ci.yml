name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Generar la interfaz que se embebe en Rust
        working-directory: installer-ui
        run: npm ci && npm run build

      - name: Comprobar formato
        run: cargo fmt --check

      - name: Comprobar compilación
        run: cargo check --locked

      - name: Ejecutar pruebas
        run: cargo test --locked

      - name: Ejecutar Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Auditar dependencias Rust
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer-ui
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run lint

      - name: Construir bundle de producción
        run: npm run build

      - name: Revisar React con React Doctor
        run: npx --yes react-doctor@0.9.12 --no-telemetry --scope changed

      - name: Auditar dependencias npm
        run: npm audit --audit-level=high

  panel:
    name: Panel Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Panel
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar ESLint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Construir Panel de producción
        run: npm run build

      - name: Revisar React con React Doctor
        run: npx --yes react-doctor@0.9.12 --no-telemetry --scope changed

      - name: Auditar dependencias npm
        run: npm audit --audit-level=high

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar sintaxis Bash
        run: bash -n scripts/build-rpm.sh tests/docker-matrix.sh

  alma-smoke:
    name: AlmaLinux smoke real
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir RPM en AlmaLinux 9
        run: docker run --rm -v "$PWD:/src" -w /src almalinux:9 bash -lc 'dnf install -y nodejs npm cargo rust rpm-build gcc pkgconf-pkg-config openssl-devel && scripts/build-rpm.sh'
      - name: Probar Nginx en contenedor limpio
        env:
          CPN_TEST_SCOPE: server
          CPN_TEST_SERVERS: nginx
        run: tests/docker-matrix.sh
      - name: Conservar logs si falla
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alma-smoke-logs
          path: target/test-logs
