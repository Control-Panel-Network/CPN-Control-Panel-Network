name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Rust
        # Pin to commit SHA (actions/unpinned-tag). Tag: stable.
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Instalar Node.js (bundle real de Vite)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Construir installer-ui embebido
        working-directory: installer-ui
        run: |
          npm ci
          npm run build

      - name: Comprobar formato
        run: cargo fmt --check

      - name: Comprobar versión sincronizada
        run: |
          chmod +x scripts/check-version-sync.sh scripts/sync-version.sh
          ./scripts/check-version-sync.sh

      - name: Comprobar compilación (locked)
        run: cargo check --locked

      - name: Ejecutar pruebas
        run: cargo test --locked

      - name: Ejecutar Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Auditoría de dependencias Rust
        run: |
          cargo install cargo-audit --locked
          cargo audit

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install Node.js (Vite embed)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Install OpenSSL (Windows)
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\Program Files (x86)\OpenSSL-Win64"
          )
          $dir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "OpenSSL install directory not found" }
          $libCandidates = @(
            (Join-Path $dir "lib\VC\x64\MD"),
            (Join-Path $dir "lib\VC\x64\MT"),
            (Join-Path $dir "lib")
          )
          $libDir = $libCandidates | Where-Object { Test-Path (Join-Path $_ "libssl.lib") } | Select-Object -First 1
          if (-not $libDir) {
            $hit = Get-ChildItem -Path $dir -Recurse -Filter "libssl.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $libDir = $hit.Directory.FullName }
          }
          if (-not $libDir) { throw "OpenSSL libssl.lib not found under $dir" }
          "OPENSSL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OPENSSL_DIR=$dir"
          Write-Host "OPENSSL_LIB_DIR=$libDir"

      - name: Build installer-ui embed
        working-directory: installer-ui
        run: |
          npm ci
          npm run build

      - name: Cargo check (Windows MSVC)
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Cargo test (Windows MSVC)
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Cargo clippy (Windows MSVC)
        run: cargo clippy --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Build release binaries
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Windows zip contents
        shell: pwsh
        run: |
          $stage = "dist/windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/cpn-installer.exe $stage/
          Copy-Item target/x86_64-pc-windows-msvc/release/cpn.exe $stage/
          Copy-Item packaging/windows/Install-Cpn.ps1 $stage/
          Copy-Item packaging/windows/Uninstall-Cpn.ps1 $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath dist/cpn-windows-x86_64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpn-windows-${{ github.sha }}
          path: |
            dist/cpn-windows-x86_64.zip
            dist/windows/*

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer-ui
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run lint

      - name: Auditoría npm (instalador UI)
        # Registry audit API can return transient 400s; do not block OS/docs merges on that.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build Vite de producción
        run: npm run build

  panel:
    name: Panel Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Panel
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Panel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar ESLint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Auth session self-test (issue #8)
        run: npm run auth-selftest

      - name: Auditoría npm (Panel)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build de producción Next.js
        run: npm run build

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # Privileged docker-matrix stays in .github/workflows/os-matrix.yml (issue #7:
      # no --privileged on untrusted PRs). Operators can also run:
      #   CPN_TEST_IMAGES="rockylinux:9 almalinux:8" ./tests/docker-matrix.sh
      - name: Comprobar sintaxis Bash
        run: >
          bash -n
          scripts/build-rpm.sh
          scripts/build-deb.sh
          scripts/docker-build-rpm.sh
          scripts/docker-build-deb.sh
          scripts/docker-run.sh
          scripts/sync-version.sh
          scripts/check-version-sync.sh
          scripts/publish-checksums.sh
          scripts/sign-release.sh
          scripts/sign-cosign.sh
          tests/docker-matrix.sh
          tests/webmail-permissions.sh
