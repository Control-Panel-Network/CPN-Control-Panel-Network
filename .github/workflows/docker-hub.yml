name: Docker Hub publish

# Builds native packages, then docker/Dockerfile.* runtime images, and pushes
# master3395/cpn-installer tags to Docker Hub (alpha/prerelease product line).
#
# OS tags: almalinux9, almalinux10, ubuntu22.04, ubuntu24.04, ubuntu26.04, latest
# latest tracks almalinux9 (primary EL baseline). Semver tags come from v* Git tags.
#
# Triggers on v* tag push because GitHub Releases created with GITHUB_TOKEN do not
# fire release:published for other workflows.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      os_tag:
        description: OS tag (almalinux9, almalinux10, ubuntu22.04, ubuntu24.04, ubuntu26.04, or all)
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: alma
            alma: "9"
            tag: almalinux9
            latest: true
            dockerfile: docker/Dockerfile.almalinux
          - family: alma
            alma: "10"
            tag: almalinux10
            latest: false
            dockerfile: docker/Dockerfile.almalinux
          - family: ubuntu
            ubuntu_version: "22.04"
            tag: ubuntu22.04
            latest: false
            dockerfile: docker/Dockerfile.ubuntu
          - family: ubuntu
            ubuntu_version: "24.04"
            tag: ubuntu24.04
            latest: false
            dockerfile: docker/Dockerfile.ubuntu
          - family: ubuntu
            ubuntu_version: "26.04"
            tag: ubuntu26.04
            latest: false
            dockerfile: docker/Dockerfile.ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Optionally filter matrix
        id: want
        env:
          OS_TAG: ${{ github.event.inputs.os_tag }}
          EVENT: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          os_tag="${OS_TAG:-all}"
          if [ "${EVENT}" = "release" ] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            os_tag="all"
          fi
          if [ "${os_tag}" = "all" ] || [ "${os_tag}" = "${TAG}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve CPN version for image tags
        if: steps.want.outputs.run == 'true'
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ver=""
          if [ "${EVENT}" = "release" ] && [ -n "${RELEASE_TAG:-}" ]; then
            ver="${RELEASE_TAG#v}"
          elif [[ "${REF_NAME:-}" == v* ]]; then
            ver="${REF_NAME#v}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.want.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Detect Docker Hub credentials
        if: steps.want.outputs.run == 'true'
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Missing DOCKERHUB_USERNAME / DOCKERHUB_TOKEN; will build only."
          fi

      - name: Require Docker Hub secrets for automated publish
        if: >-
          steps.want.outputs.run == 'true'
          && steps.hub.outputs.available != 'true'
          && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "::error::Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish master3395/cpn-installer."
          exit 1

      - name: Log in to Docker Hub
        if: steps.want.outputs.run == 'true' && steps.hub.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build AlmaLinux RPM
        if: steps.want.outputs.run == 'true' && matrix.family == 'alma'
        env:
          CPN_ALMA_VERSION: ${{ matrix.alma }}
          CPN_CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail
          chmod +x scripts/docker-build-rpm.sh scripts/build-rpm.sh
          ./scripts/docker-build-rpm.sh
          shopt -s nullglob
          rpms=(target/rpmbuild/RPMS/*/cpn-installer-*.rpm)
          test "${#rpms[@]}" -ge 1
          cp -f "${rpms[0]}" ./cpn-installer.rpm
          ls -lh ./cpn-installer.rpm

      - name: Build Ubuntu DEB
        if: steps.want.outputs.run == 'true' && matrix.family == 'ubuntu'
        env:
          CPN_UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
          CPN_CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail
          chmod +x scripts/docker-build-deb.sh scripts/build-deb.sh
          ./scripts/docker-build-deb.sh
          shopt -s nullglob
          debs=(target/deb/*.deb)
          test "${#debs[@]}" -ge 1
          cp -f "${debs[0]}" ./cpn-installer.deb
          ls -lh ./cpn-installer.deb

      - name: Build runtime image (no Hub secrets)
        if: steps.want.outputs.run == 'true' && steps.hub.outputs.available != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: master3395/cpn-installer:${{ matrix.tag }}
          build-args: |
            ALMA_VERSION=${{ matrix.alma }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}

      - name: Build and push image
        if: steps.want.outputs.run == 'true' && steps.hub.outputs.available == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            master3395/cpn-installer:${{ matrix.tag }}
            ${{ matrix.latest && 'master3395/cpn-installer:latest' || '' }}
            ${{ matrix.latest && steps.ver.outputs.version != '' && format('master3395/cpn-installer:{0}', steps.ver.outputs.version) || '' }}
          build-args: |
            ALMA_VERSION=${{ matrix.alma }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            cpn.os.family=${{ matrix.family }}
            cpn.almalinux.version=${{ matrix.alma }}
            cpn.ubuntu.version=${{ matrix.ubuntu_version }}

      - name: Smoke check pushed image
        if: steps.want.outputs.run == 'true' && steps.hub.outputs.available == 'true'
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          docker pull "master3395/cpn-installer:${{ matrix.tag }}"
          if [ "${FAMILY}" = "alma" ]; then
            docker run --rm --entrypoint /bin/bash \
              "master3395/cpn-installer:${{ matrix.tag }}" \
              -lc 'rpm -q cpn-installer && systemctl is-enabled cpn-installer.service'
          else
            docker run --rm --entrypoint /bin/bash \
              "master3395/cpn-installer:${{ matrix.tag }}" \
              -lc 'dpkg -l cpn-installer | grep -q ^ii && systemctl is-enabled cpn-installer.service'
          fi

      - name: Report pushed digest
        if: steps.want.outputs.run == 'true' && steps.hub.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker pull "master3395/cpn-installer:${{ matrix.tag }}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "master3395/cpn-installer:${{ matrix.tag }}")"
          echo "Pushed master3395/cpn-installer:${{ matrix.tag }} (${digest})"
