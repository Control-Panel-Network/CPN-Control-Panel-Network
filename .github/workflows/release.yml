name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts and checksums without creating a GitHub Release"
        required: false
        default: "true"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CPN_RELEASE_FINGERPRINT: FE70B9718F63B10BB70A6F70BECBB7488AE5C3E5

jobs:
  windows-package:
    name: Build Windows Phase A package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\Program Files (x86)\OpenSSL-Win64"
          )
          $dir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "OpenSSL install directory not found" }
          $libCandidates = @(
            (Join-Path $dir "lib\VC\x64\MD"),
            (Join-Path $dir "lib\VC\x64\MT"),
            (Join-Path $dir "lib")
          )
          $libDir = $libCandidates | Where-Object { Test-Path (Join-Path $_ "libssl.lib") } | Select-Object -First 1
          if (-not $libDir) {
            $hit = Get-ChildItem -Path $dir -Recurse -Filter "libssl.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $libDir = $hit.Directory.FullName }
          }
          if (-not $libDir) { throw "OpenSSL libssl.lib not found under $dir" }
          "OPENSSL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build embedded installer UI
        working-directory: installer-ui
        run: |
          npm ci
          npm run build

      - name: Build Windows binaries
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Windows release zip
        shell: pwsh
        run: |
          $stage = "dist/windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/cpn-installer.exe $stage/
          Copy-Item target/x86_64-pc-windows-msvc/release/cpn.exe $stage/
          Copy-Item packaging/windows/Install-Cpn.ps1 $stage/
          Copy-Item packaging/windows/Uninstall-Cpn.ps1 $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath dist/cpn-windows-x86_64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cpn-windows-release
          path: dist/cpn-windows-x86_64.zip

  release:
    name: Build packages, checksums and provenance
    needs: windows-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: cpn-windows-release
          path: dist

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Verify tag matches Cargo.toml
        run: |
          chmod +x scripts/check-version-sync.sh
          ./scripts/check-version-sync.sh

      - name: Record toolchain provenance notes
        run: |
          mkdir -p dist
          {
            echo "rustc:"
            rustc -Vv
            echo
            echo "cargo:"
            cargo -Vv
            echo
            echo "runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "gpg_fingerprint: ${CPN_RELEASE_FINGERPRINT}"
          } | tee dist/build-environment.txt

      - name: Install Node.js (Vite embed)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-ui/package-lock.json

      - name: Build installer-ui embed
        working-directory: installer-ui
        run: |
          npm ci
          npm run build

      - name: Build release binaries (locked)
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/cpn-installer dist/cpn-installer
          cp target/release/cpn dist/cpn
          chmod +x dist/cpn-installer dist/cpn

      - name: Build RPMs for EL 8, 9 and 10
        run: |
          chmod +x scripts/docker-build-rpm.sh scripts/build-rpm.sh scripts/sync-version.sh
          ./scripts/sync-version.sh
          for major in 8 9 10; do
            echo "Building EL${major} RPM"
            CPN_ALMA_VERSION="$major" ./scripts/docker-build-rpm.sh
          done
          shopt -s nullglob
          rpms=(target/rpmbuild/RPMS/*/*.rpm)
          if ((${#rpms[@]} < 3)); then
            echo "Expected EL8/EL9/EL10 RPM builds; found ${#rpms[@]} package(s)" >&2
            printf '%s\n' "${rpms[@]}" >&2
            exit 1
          fi
          cp "${rpms[@]}" dist/

      - name: Build apt-family DEB on Ubuntu 22.04 baseline
        run: |
          chmod +x scripts/docker-build-deb.sh scripts/build-deb.sh scripts/sync-version.sh
          CPN_BUILD_IMAGE=ubuntu:22.04 CPN_UBUNTU_VERSION=22.04 ./scripts/docker-build-deb.sh
          shopt -s nullglob
          debs=(target/deb/*.deb)
          if ((${#debs[@]} == 0)); then
            echo "DEB build produced no packages" >&2
            exit 1
          fi
          cp "${debs[@]}" dist/

      - name: Install GPG tools on runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg2

      - name: Embed RPM signatures and create detached RPM signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          CPN_REQUIRE_GPG: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          CPN_REQUIRE_RPMSIGN: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: |
          chmod +x scripts/sign-rpm-almalinux.sh scripts/sign-release.sh
          if [[ "${CPN_REQUIRE_GPG}" == "1" && -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "Official tag release requires GPG_PRIVATE_KEY." >&2
            exit 1
          fi
          shopt -s nullglob
          rpms=(dist/*.rpm)
          if ((${#rpms[@]} == 0)); then
            echo "No RPMs in dist/ to sign" >&2
            exit 1
          fi
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            ./scripts/sign-rpm-almalinux.sh "${rpms[@]}"
            for rpm in "${rpms[@]}"; do
              test -f "${rpm}.asc"
            done
          else
            echo "Dry-run without GPG secrets; RPMs left unsigned."
          fi

      - name: Publish SHA256SUMS
        run: |
          chmod +x scripts/publish-checksums.sh
          shopt -s nullglob
          files=(dist/cpn-installer dist/cpn dist/*.rpm dist/*.deb dist/*.zip dist/build-environment.txt)
          ./scripts/publish-checksums.sh "${files[@]}"
          test -f dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Detached-sign checksum manifest and portable artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          CPN_REQUIRE_GPG: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          CPN_RPMSIGN: "0"
        run: |
          chmod +x scripts/sign-release.sh
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            if [[ "${CPN_REQUIRE_GPG}" == "1" ]]; then
              echo "GPG_PRIVATE_KEY required" >&2
              exit 1
            fi
            echo "Skipping detached signatures (no GPG secret)."
            exit 0
          fi
          shopt -s nullglob
          portable=(dist/*.deb dist/*.zip)
          ./scripts/sign-release.sh dist/SHA256SUMS dist/cpn-installer dist/cpn "${portable[@]}"
          test -f dist/SHA256SUMS.asc

      - name: Optional cosign blob signatures
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [[ -n "${COSIGN_KEY:-}" ]]; then
            curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /tmp/cosign
            chmod +x /tmp/cosign
            sudo mv /tmp/cosign /usr/local/bin/cosign
          fi
          chmod +x scripts/sign-cosign.sh
          ./scripts/sign-cosign.sh dist/cpn-installer dist/SHA256SUMS

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx -f json --override-filename cpn-installer.cdx
          mv cpn-installer.cdx.json dist/cpn-installer.cdx.json
          test -s dist/cpn-installer.cdx.json
          ! grep -q 'SBOM generation skipped' dist/cpn-installer.cdx.json
          chmod +x scripts/publish-checksums.sh
          shopt -s nullglob
          files=(dist/cpn-installer dist/cpn dist/*.rpm dist/*.deb dist/*.zip dist/cpn-installer.cdx.json dist/build-environment.txt)
          ./scripts/publish-checksums.sh "${files[@]}"

      - name: Re-sign SHA256SUMS after SBOM refresh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          CPN_REQUIRE_GPG: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          CPN_RPMSIGN: "0"
        run: |
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            if [[ "${CPN_REQUIRE_GPG}" == "1" ]]; then
              echo "GPG_PRIVATE_KEY required" >&2
              exit 1
            fi
            exit 0
          fi
          chmod +x scripts/sign-release.sh
          rm -f dist/SHA256SUMS.asc
          ./scripts/sign-release.sh dist/SHA256SUMS
          test -f dist/SHA256SUMS.asc

      - name: Copy public release key into dist
        run: |
          cp packaging/RPM-GPG-KEY-CPN dist/RPM-GPG-KEY-CPN
          echo "${CPN_RELEASE_FINGERPRINT}" > dist/GPG-FINGERPRINT.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/cpn-installer
            dist/cpn
            dist/SHA256SUMS
            dist/*.rpm
            dist/*.deb
            dist/*.zip
            dist/cpn-installer.cdx.json
            dist/build-environment.txt
            dist/RPM-GPG-KEY-CPN

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpn-release-${{ github.sha }}
          path: dist/**

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install from this release

            Download the native package for the guest OS instead of building CPN from source:

            - EL8: `cpn-installer-*.el8.*.rpm`
            - EL9: `cpn-installer-*.el9.*.rpm`
            - EL10: `cpn-installer-*.el10.*.rpm`
            - Ubuntu 22.04/24.04 and tested compatible apt guests: `cpn-installer_*.deb`
            - Windows Server 2016+ Phase A: `cpn-windows-x86_64.zip`

            ```bash
            sudo dnf install ./cpn-installer-*.rpm
            # or
            sudo apt install ./cpn-installer_*.deb

            sudo cpn-installer
            ```

            Windows: extract the ZIP and run `Install-Cpn.ps1` from an elevated PowerShell prompt. Windows remains Phase A only; Linux web/mail package recipes are not available there.

            ## Verify before running as administrator/root

            Release signing fingerprint:

            ```text
            FE70B9718F63B10BB70A6F70BECBB7488AE5C3E5
            ```

            ```bash
            sha256sum -c SHA256SUMS
            gpg --import RPM-GPG-KEY-CPN
            gpg --verify SHA256SUMS.asc SHA256SUMS

            # RPM only
            rpm --import RPM-GPG-KEY-CPN
            rpm --checksig *.rpm

            # GitHub provenance attestation
            gh attestation verify ./cpn-installer --repo Control-Panel-Network/CPN-Control-Panel-Network
            ```

            Upgrade/repair downloads verify SHA-256 by default (`CPN_VERIFY_RELEASE=0` disables; `CPN_VERIFY_GPG=1` also checks `SHA256SUMS.asc`).
