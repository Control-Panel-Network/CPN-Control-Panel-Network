name: OS matrix

# Privileged systemd containers. Not run on untrusted PRs.
# Trigger manually or on main pushes after merge.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Matrix scope"
        type: choice
        options:
          - primary
          - extended
          - mail
        default: extended
  push:
    branches: [main]
    paths:
      - "src/os_support.rs"
      - "src/install_recipes.rs"
      - "src/install_server.rs"
      - "src/install_mail_backend.rs"
      - "src/install_webmail.rs"
      - "src/manifest.rs"
      - "src/environment.rs"
      - "packaging/**"
      - "tests/docker-matrix.sh"
      - "scripts/build-rpm.sh"
      - "scripts/build-deb.sh"
      - "scripts/docker-build-rpm.sh"
      - "scripts/docker-build-deb.sh"
      - ".github/workflows/os-matrix.yml"

permissions:
  contents: read

jobs:
  primary-rpm:
    name: Primary RPM smoke (${{ matrix.image }})
    if: github.event_name == 'push' || inputs.scope == 'primary' || inputs.scope == 'extended'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: almalinux:9
            el_major: "9"
          - image: almalinux:10
            el_major: "10"
          - image: rockylinux:9
            el_major: "9"
    steps:
      - uses: actions/checkout@v7
      - name: Build matching RPM
        env:
          CPN_ALMA_VERSION: ${{ matrix.el_major }}
          CPN_BUILD_IMAGE: ${{ matrix.image }}
        run: ./scripts/docker-build-rpm.sh
      - name: Nginx smoke
        env:
          CPN_TEST_IMAGE: ${{ matrix.image }}
          CPN_TEST_SCOPE: server
          CPN_TEST_SERVERS: nginx
        run: ./tests/docker-matrix.sh
      - name: Upload matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: primary-rpm-${{ strategy.job-index }}-logs
          path: |
            target/rpmbuild/RPMS/**/*.rpm
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore

  primary-apt:
    name: Primary apt smoke (${{ matrix.image }})
    if: github.event_name == 'push' || inputs.scope == 'primary' || inputs.scope == 'extended'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build matching DEB
        env:
          CPN_BUILD_IMAGE: ${{ matrix.image }}
        run: ./scripts/docker-build-deb.sh
      - name: Nginx smoke
        env:
          CPN_TEST_IMAGE: ${{ matrix.image }}
          CPN_TEST_SCOPE: server
          CPN_TEST_SERVERS: nginx
        run: ./tests/docker-matrix.sh
      - name: Upload matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: primary-apt-${{ strategy.job-index }}-logs
          path: |
            target/deb/*.deb
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore

  mail-roundtrip:
    name: Rocky 9 mail E2E (Roundcube)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'mail' || inputs.scope == 'extended'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Build Rocky 9 RPM
        env:
          CPN_ALMA_VERSION: "9"
          CPN_BUILD_IMAGE: rockylinux:9
        run: ./scripts/docker-build-rpm.sh
      - name: Roundcube + Postfix/Dovecot smoke
        run: |
          CPN_TEST_IMAGE=rockylinux:9 \
          CPN_TEST_SCOPE=mail \
          CPN_TEST_MAILS=roundcube \
          ./tests/docker-matrix.sh
      - name: Upload mail matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mail-matrix-logs
          path: |
            target/rpmbuild/RPMS/**/*.rpm
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore

  extended:
    name: Extended guest smoke (${{ matrix.image }})
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'extended'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: almalinux:8
            pkg: rpm
            el_major: "8"
          - image: rockylinux:8
            pkg: rpm
            el_major: "8"
          - image: quay.io/centos/centos:stream9
            pkg: rpm
            el_major: "9"
          - image: rockylinux:10
            pkg: rpm
            el_major: "10"
          - image: debian:12
            pkg: deb
          - image: debian:13
            pkg: deb
    steps:
      - uses: actions/checkout@v7
      - name: Build matching RPM
        if: matrix.pkg == 'rpm'
        env:
          CPN_ALMA_VERSION: ${{ matrix.el_major }}
          CPN_BUILD_IMAGE: ${{ matrix.image }}
        run: ./scripts/docker-build-rpm.sh
      - name: Build matching DEB
        if: matrix.pkg == 'deb'
        env:
          CPN_BUILD_IMAGE: ${{ matrix.image }}
        run: ./scripts/docker-build-deb.sh
      - name: Nginx smoke
        env:
          CPN_TEST_IMAGE: ${{ matrix.image }}
          CPN_TEST_SCOPE: server
          CPN_TEST_SERVERS: nginx
        run: ./tests/docker-matrix.sh
      - name: Upload extended matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ strategy.job-index }}-logs
          path: |
            target/rpmbuild/RPMS/**/*.rpm
            target/deb/*.deb
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore
