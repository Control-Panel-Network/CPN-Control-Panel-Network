name: OS matrix

# Privileged systemd containers. Not run on untrusted PRs (issue #7).
# Trigger manually or on main pushes after merge.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Matrix scope"
        type: choice
        options:
          - rocky9
          - extended
          - mail
        default: extended
  push:
    branches: [main]
    paths:
      - "src/os_support.rs"
      - "src/install_recipes.rs"
      - "src/install_mail_backend.rs"
      - "src/install_webmail.rs"
      - "src/manifest.rs"
      - "tests/docker-matrix.sh"
      - "scripts/docker-build-rpm.sh"
      - "scripts/docker-build-deb.sh"
      - ".github/workflows/os-matrix.yml"

permissions:
  contents: read

jobs:
  rocky9:
    name: Rocky 9 nginx smoke
    if: github.event_name == 'push' || inputs.scope == 'rocky9' || inputs.scope == 'extended'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build RPM
        run: ./scripts/docker-build-rpm.sh
      - name: Nginx smoke
        run: |
          CPN_TEST_IMAGE=rockylinux:9 \
          CPN_TEST_SCOPE=server \
          CPN_TEST_SERVERS=nginx \
          ./tests/docker-matrix.sh
      - name: Upload matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: rocky9-matrix-logs
          path: |
            target/rpmbuild/RPMS/**/*.rpm
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore

  mail-roundtrip:
    name: Rocky 9 mail E2E (Roundcube)
    # Run on main path pushes (mail/matrix files) and on manual mail/extended dispatch (issues #7/#9).
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'mail' || inputs.scope == 'extended'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Build RPM
        run: ./scripts/docker-build-rpm.sh
      - name: Roundcube + Postfix/Dovecot smoke
        run: |
          CPN_TEST_IMAGE=rockylinux:9 \
          CPN_TEST_SCOPE=mail \
          CPN_TEST_MAILS=roundcube \
          ./tests/docker-matrix.sh
      - name: Upload mail matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mail-matrix-logs
          path: |
            target/rpmbuild/RPMS/**/*.rpm
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore

  extended:
    name: Extended guest smoke
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'extended'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: almalinux:8
            pkg: rpm
          - image: rockylinux:8
            pkg: rpm
          - image: quay.io/centos/centos:stream9
            pkg: rpm
          - image: ubuntu:22.04
            pkg: deb
            ubuntu: "22.04"
          - image: ubuntu:24.04
            pkg: deb
            ubuntu: "24.04"
    steps:
      - uses: actions/checkout@v7
      - name: Build RPM
        if: matrix.pkg == 'rpm'
        run: ./scripts/docker-build-rpm.sh
      - name: Build Deb
        if: matrix.pkg == 'deb'
        env:
          CPN_UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: ./scripts/docker-build-deb.sh
      - name: Nginx smoke on ${{ matrix.image }}
        run: |
          CPN_TEST_IMAGE='${{ matrix.image }}' \
          CPN_TEST_SCOPE=server \
          CPN_TEST_SERVERS=nginx \
          ./tests/docker-matrix.sh
      - name: Upload extended matrix diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ strategy.job-index }}-logs
          path: |
            target/rpmbuild/RPMS/**/*.rpm
            target/deb/*.deb
            /tmp/cpn-matrix-*.log
          if-no-files-found: ignore
