[package]
name = "cpn-installer"
version = "1.4.1"
edition = "2024"
description = "CPN Server Panel installer (web UI and SSH/CLI)"
license = "GPL-3.0-only"
repository = "https://github.com/Control-Panel-Network/CPN-Control-Panel-Network"

[lib]
name = "cpn_installer"
path = "src/lib.rs"

[[bin]]
name = "cpn-installer"
path = "src/main.rs"

[[bin]]
name = "cpn"
path = "src/bin/cpn.rs"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
aes-gcm = "0.11"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
futures-util = "0.3"
hmac = "0.13"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals", "danger-user-presence-only-security-keys"] }
# `webauthn-rs` (passkeys) links OpenSSL through `openssl-sys`. This optional direct
# dependency only exists so the `vendored-openssl` feature can build OpenSSL from
# source (needs a C compiler plus Perl; NASM is optional on Windows MSVC). Default
# builds keep linking the system OpenSSL exactly as before.
openssl-sys = { version = "0.9", optional = true }

[features]
default = []
# Build and statically link OpenSSL instead of requiring OPENSSL_DIR / system libs.
# Opt-in for developer builds (for example Windows without an OpenSSL SDK);
# release packages keep the system OpenSSL. See CONTRIBUTING.md.
vendored-openssl = ["dep:openssl-sys", "openssl-sys/vendored"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
