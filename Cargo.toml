[package]
name = "cpn-installer"
version = "0.1.0"
edition = "2024"
description = "Instalador web local para CPN Server Panel"
license = "GPL-3.0-only"
repository = "https://github.com/KraoESPfan1n/CPN-Control-Panel-Network"

[dependencies]
actix-web = "4"
actix-ws = "0.4"
futures-util = "0.3"
libc = "0.2"
rand = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
