[package]
name = "cpn-installer"
version = "0.2.2-alpha.3"
edition = "2024"
description = "Instalador web local para CPN Server Panel"
license = "GPL-3.0-only"
repository = "https://github.com/KraoESPfan1n/CPN-Control-Panel-Network"

[lib]
name = "cpn_installer"
path = "src/lib.rs"

[[bin]]
name = "cpn-installer"
path = "src/main.rs"

[[bin]]
name = "cpn"
path = "src/bin/cpn.rs"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
aes-gcm = "0.10"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
futures-util = "0.3"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

