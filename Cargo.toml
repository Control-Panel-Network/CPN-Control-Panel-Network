[package]
name = "cpn-installer"
version = "0.2.0"
edition = "2024"
description = "Instalador web local para CPN Server Panel"
license = "GPL-3.0-only"
repository = "https://github.com/KraoESPfan1n/CPN-Control-Panel-Network"

[lib]
name = "cpn_installer"
path = "src/lib.rs"

[[bin]]
name = "cpn-installer"
path = "src/main.rs"

[[bin]]
name = "cpn"
path = "src/bin/cpn.rs"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
libc = "0.2"
rand = "0.9"
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"